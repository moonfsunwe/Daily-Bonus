name: Daily Bonus
 
on:
  push:
    branches:
      - master
  schedule:
    - cron: '30 0 * * *' # 北京时间 8:30 自动运行
  workflow_dispatch:      # 允许你在网页上手动点按钮测试

permissions:
  contents: write
  
jobs:
  checkin:
    strategy:
      matrix:
        os: [self-hosted]
        # os: [ubuntu-latest, self-hosted]

    runs-on: ${{ matrix.os }}

    env:
      V2EX_COOKIES: ${{ secrets.V2EX_COOKIES }}
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
      YAMIBO_COOKIES: ${{ secrets.YAMIBO_COOKIES }}
      YURIFANS_EMAIL: ${{ secrets.YURIFANS_EMAIL }}
      YURIFANS_PASSWORD: ${{ secrets.YURIFANS_PASSWORD }}
      PICA_EMAIL: ${{ secrets.PICA_EMAIL }}
      PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check-in
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          # 直接运行脚本，因为所有“手术”我们已经在手机终端里做完了
          python ./message.py

      - name: Commit files to keep repo active
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo $(date) > keep_alive.txt
          git add keep_alive.txt
          git commit -m "🚀 保持仓库活跃防止60天休眠" || exit 0
          git push origin master
